<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List - PostHog</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Todo List</h1>
    <div class="input-group">
      <input type="text" id="todoInput" placeholder="Adicionar nova tarefa..." />
      <button id="addBtn">Adicionar</button>
    </div>
    <ul id="todoList"></ul>
    <div class="stats">
      <span id="totalCount">Total: 0</span>
      <span id="doneCount">Concluidas: 0</span>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
